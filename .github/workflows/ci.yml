name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Compile check
        run: |
          python -m py_compile main.py server.py scanner.py downloader.py processor.py videoqueue.py settings.py runtime_state.py
      - name: Run tests
        run: python -m unittest discover -s tests -v
