services:
  yt-plex-mini:
    image: ghcr.io/zincplusplus/yt-plex:latest
    container_name: yt-plex-mini
    restart: unless-stopped
    ports:
      - "8081:8080"
    volumes:
      - ./data:/app/data
      - ./downloads:/downloads
    environment:
      - DOWNLOADS_DIR=/downloads

x-casaos:
  main: yt-plex-mini
  store_app_id: yt-plex-mini
  title:
    en_us: yt-plex mini
  description:
    en_us: Minimal YouTube downloader with smart sponsor removal
  tagline:
    en_us: YouTube to Plex, simplified
  icon: https://raw.githubusercontent.com/nicholasgasior/glyph/master/svg/si-youtube.svg
  category: Media
  port_map: "8081"
  scheme: http
  architectures:
    - amd64
    - arm64
